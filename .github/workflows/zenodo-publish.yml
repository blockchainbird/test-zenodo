name: Publish release to Zenodo (update)

# Automates the Zenodo *update* path only (New version → upload ZIP → publish).
# First-time DOI creation (reserve DOI, embed in source, first publish) stays manual:
# https://trustoverip.github.io/spec-up-t-website/docs/developer-documentation/create-zenodo-doi
#
# Required:
#   ZENODO_USER_API_TOKEN   — secret; Zenodo personal access token of a Zenodo *user*
#                             (scopes: deposit:write + deposit:actions). Bound to that user.
#   ZENODO_SPEC_MAIN_DOI    — variable (preferred); this specification’s stable Main ID,
#                             e.g. 10.5281/zenodo.XXXXXXXX. Bound to this spec / repo.
#                             (Zenodo’s UI may call this the Concept DOI.)
#
# Optional:
#   ZENODO_SPEC_LATEST_DEPOSITION_ID — secret; numeric id of the latest published version.
#                             Only needed if ZENODO_SPEC_MAIN_DOI is not set. Prefer Main DOI.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (defaults to latest release)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: zenodo-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  zenodo-new-version:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        env:
          ZENODO_USER_API_TOKEN: ${{ secrets.ZENODO_USER_API_TOKEN }}
          ZENODO_SPEC_LATEST_DEPOSITION_ID: ${{ secrets.ZENODO_SPEC_LATEST_DEPOSITION_ID }}
          ZENODO_SPEC_MAIN_DOI: ${{ vars.ZENODO_SPEC_MAIN_DOI }}
        run: |
          if [ -z "$ZENODO_USER_API_TOKEN" ]; then
            echo "::error::Missing secret ZENODO_USER_API_TOKEN (Zenodo user API token). Create one at https://zenodo.org/account/settings/applications/tokens/new/ (scopes: deposit:write, deposit:actions)."
            exit 1
          fi
          if [ -z "$ZENODO_SPEC_LATEST_DEPOSITION_ID" ] && [ -z "$ZENODO_SPEC_MAIN_DOI" ]; then
            echo "::error::Set variable ZENODO_SPEC_MAIN_DOI (this spec’s Main ID) or secret ZENODO_SPEC_LATEST_DEPOSITION_ID."
            exit 1
          fi

      - name: Resolve release asset
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then
            TAG="$INPUT_TAG"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # GitHub source ZIP for the tag.
          # Use the public archive URL (real ZIP). Do not send Accept:
          # application/octet-stream — GitHub zipball/API returns HTTP 415 for that.
          OUT="release-${TAG}.zip"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -L "https://api.github.com/repos/${{ github.repository }}/zipball/${TAG}" \
            -o "$OUT"
          SIZE=$(wc -c < "$OUT" | tr -d ' ')
          echo "Downloaded $OUT ($SIZE bytes)"
          if [ "$SIZE" -lt 1000 ]; then
            echo "::error::Release ZIP is suspiciously small ($SIZE bytes). First bytes:"
            head -c 500 "$OUT" || true
            exit 1
          fi
          # ZIP local file header is PK\x03\x04
          if ! head -c 2 "$OUT" | grep -q 'PK'; then
            echo "::error::Downloaded file is not a ZIP (missing PK header). First bytes:"
            head -c 200 "$OUT" || true
            exit 1
          fi
          echo "zip_path=$OUT" >> "$GITHUB_OUTPUT"
          echo "zip_name=$(basename "$OUT")" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Resolve latest Zenodo deposition ID
        id: zenodo
        env:
          ZENODO_USER_API_TOKEN: ${{ secrets.ZENODO_USER_API_TOKEN }}
          ZENODO_SPEC_LATEST_DEPOSITION_ID: ${{ secrets.ZENODO_SPEC_LATEST_DEPOSITION_ID }}
          ZENODO_SPEC_MAIN_DOI: ${{ vars.ZENODO_SPEC_MAIN_DOI }}
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer ${ZENODO_USER_API_TOKEN}"

          if [ -n "${ZENODO_SPEC_LATEST_DEPOSITION_ID:-}" ]; then
            DEPOSITION_ID="$ZENODO_SPEC_LATEST_DEPOSITION_ID"
            echo "Using ZENODO_SPEC_LATEST_DEPOSITION_ID=$DEPOSITION_ID"
          else
            # Main ID form: 10.5281/zenodo.<mainrecid> (Zenodo: Concept DOI)
            MAIN_RECID="${ZENODO_SPEC_MAIN_DOI##*.}"
            echo "Resolving latest published version for Main ID recid=$MAIN_RECID"
            # Records API: Main ID resolves to latest via an HTTP redirect, so -L is
            # required here (GET only; never follow redirects on POST/PUT).
            LATEST=$(curl -fsSL -H "$AUTH" \
              "https://zenodo.org/api/records/${MAIN_RECID}" | jq -r '.id')
            if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
              echo "::error::Could not resolve latest record for $ZENODO_SPEC_MAIN_DOI"
              exit 1
            fi
            DEPOSITION_ID="$LATEST"
            echo "Resolved latest deposition id=$DEPOSITION_ID"
          fi

          echo "deposition_id=$DEPOSITION_ID" >> "$GITHUB_OUTPUT"

      - name: Create Zenodo new version, upload ZIP, publish
        env:
          ZENODO_USER_API_TOKEN: ${{ secrets.ZENODO_USER_API_TOKEN }}
          DEPOSITION_ID: ${{ steps.zenodo.outputs.deposition_id }}
          ZIP_PATH: ${{ steps.release.outputs.zip_path }}
          ZIP_NAME: ${{ steps.release.outputs.zip_name }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer ${ZENODO_USER_API_TOKEN}"
          API="https://zenodo.org/api"

          echo "Creating new version from deposition $DEPOSITION_ID ..."
          # Do not use curl -L on Zenodo API calls (redirects break PUT/POST).
          NEWVERSION_JSON=$(curl -fsS -X POST -H "$AUTH" \
            "${API}/deposit/depositions/${DEPOSITION_ID}/actions/newversion")

          DRAFT_URL=$(echo "$NEWVERSION_JSON" | jq -r '.links.latest_draft')
          if [ -z "$DRAFT_URL" ] || [ "$DRAFT_URL" = "null" ]; then
            echo "::error::newversion did not return links.latest_draft"
            echo "$NEWVERSION_JSON" | jq .
            exit 1
          fi

          DRAFT_ID="${DRAFT_URL##*/}"
          echo "Draft deposition id=$DRAFT_ID"

          DRAFT_JSON=$(curl -fsS -H "$AUTH" "${API}/deposit/depositions/${DRAFT_ID}")
          BUCKET=$(echo "$DRAFT_JSON" | jq -r '.links.bucket')
          echo "Bucket: $BUCKET"

          # Remove inherited files (old files API) so this version only has the new ZIP.
          echo "$DRAFT_JSON" | jq -c '.files[]?' | while read -r file; do
            [ -z "$file" ] || [ "$file" = "null" ] && continue
            FILE_ID=$(echo "$file" | jq -r '.id // empty')
            FILE_NAME=$(echo "$file" | jq -r '.filename // .key // empty')
            if [ -n "$FILE_ID" ]; then
              echo "Removing inherited file via files API: $FILE_NAME ($FILE_ID)"
              curl -fsS -X DELETE -H "$AUTH" \
                "${API}/deposit/depositions/${DRAFT_ID}/files/${FILE_ID}" >/dev/null || true
            fi
            # Also try bucket DELETE by key (newer files API)
            if [ -n "$FILE_NAME" ] && [ -n "$BUCKET" ] && [ "$BUCKET" != "null" ]; then
              echo "Removing inherited file via bucket: $FILE_NAME"
              curl -sS -o /dev/null -w "bucket_delete_http=%{http_code}\n" -X DELETE -H "$AUTH" \
                "${BUCKET}/${FILE_NAME}" || true
            fi
          done

          # Refresh draft after deletes
          DRAFT_JSON=$(curl -fsS -H "$AUTH" "${API}/deposit/depositions/${DRAFT_ID}")
          BUCKET=$(echo "$DRAFT_JSON" | jq -r '.links.bucket')

          echo "Uploading $ZIP_PATH ($ZIP_NAME, $(wc -c < "$ZIP_PATH" | tr -d ' ') bytes) ..."

          # Prefer multipart /files API (reliable Content-Length + filename).
          UPLOAD_BODY=$(mktemp)
          HTTP=$(curl -sS -o "$UPLOAD_BODY" -w "%{http_code}" -X POST -H "$AUTH" \
            -F "file=@${ZIP_PATH};filename=${ZIP_NAME};type=application/zip" \
            "${API}/deposit/depositions/${DRAFT_ID}/files" || true)
          echo "files API upload HTTP $HTTP"
          if [ "$HTTP" != "201" ] && [ "$HTTP" != "200" ]; then
            echo "files API failed; response:"
            cat "$UPLOAD_BODY" || true
            echo "Trying bucket PUT fallback ..."
            if [ -z "$BUCKET" ] || [ "$BUCKET" = "null" ]; then
              echo "::error::No bucket URL available for fallback upload"
              exit 1
            fi
            HTTP=$(curl -sS -o "$UPLOAD_BODY" -w "%{http_code}" -X PUT -H "$AUTH" \
              -H "Content-Type: application/octet-stream" \
              --upload-file "$ZIP_PATH" \
              "${BUCKET}/${ZIP_NAME}" || true)
            echo "bucket PUT HTTP $HTTP"
            if [ "$HTTP" != "201" ] && [ "$HTTP" != "200" ]; then
              echo "::error::Zenodo upload failed"
              cat "$UPLOAD_BODY" || true
              echo "::error::If a draft is stuck empty, open https://zenodo.org/deposit/${DRAFT_ID} and Discard, then re-run."
              exit 1
            fi
          fi
          cat "$UPLOAD_BODY" | jq . 2>/dev/null || cat "$UPLOAD_BODY"
          rm -f "$UPLOAD_BODY"

          # Bump version metadata when present.
          META=$(echo "$DRAFT_JSON" | jq --arg v "$TAG" '
            .metadata
            | .version = $v
            | del(.doi)   # let Zenodo assign the new Version DOI (Sub-ID)
          ')
          curl -fsS -X PUT -H "$AUTH" -H "Content-Type: application/json" \
            "${API}/deposit/depositions/${DRAFT_ID}" \
            -d "$(jq -n --argjson metadata "$META" '{metadata: $metadata}')" >/dev/null

          echo "Publishing deposition $DRAFT_ID ..."
          PUBLISHED=$(curl -fsS -X POST -H "$AUTH" \
            "${API}/deposit/depositions/${DRAFT_ID}/actions/publish")

          VERSION_DOI=$(echo "$PUBLISHED" | jq -r '.doi // .metadata.prereserve_doi.doi // empty')
          MAIN_DOI=$(echo "$PUBLISHED" | jq -r '.conceptdoi // empty')
          NEW_ID=$(echo "$PUBLISHED" | jq -r '.id')

          echo "Published Zenodo version id=$NEW_ID"
          echo "Sub-ID (Version DOI): ${VERSION_DOI:-unknown}"
          echo "Main ID: ${MAIN_DOI:-unknown}"
          {
            echo "## Zenodo publish result"
            echo ""
            echo "- Release tag: \`$TAG\`"
            echo "- New deposition id: \`$NEW_ID\`"
            echo "- Sub-ID (Version DOI): \`${VERSION_DOI:-n/a}\`"
            echo "- Main ID: \`${MAIN_DOI:-n/a}\`"
            echo ""
            echo "Update secret \`ZENODO_SPEC_LATEST_DEPOSITION_ID\` to \`$NEW_ID\` only if you are **not** using \`ZENODO_SPEC_MAIN_DOI\`."
          } >> "$GITHUB_STEP_SUMMARY"
